services:
  postgres:
    image: postgres:16-alpine
    container_name: smarthome-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db_scripts:/docker-entrypoint-initdb.d
    networks:
      - smarthome-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]

  webapp:
    build:
      context: ./webapp
      dockerfile: Dockerfile
    container_name: webapp
    environment:
      - PORT=9000
    ports:
      - "9000:9000"
    restart: unless-stopped
    networks:
      - smarthome-network

  module-managment:
    build:
      context: ./module_managment
      dockerfile: Dockerfile
    container_name: module-managment
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/smarthome
      - PORT=9001
    ports:
      - "9001:9001"
    restart: unless-stopped
    networks:
      - smarthome-network

  order-managment:
    build:
      context: ./order_managment
      dockerfile: Dockerfile
    container_name: order-managment
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/smarthome
      - PORT=9002
    ports:
      - "9002:9002"
    restart: unless-stopped
    networks:
      - smarthome-network

  partner-network:
    build:
      context: ./partner_network
      dockerfile: Dockerfile
    container_name: partner-network
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/smarthome
      - PORT=9003
    ports:
      - "9003:9003"
    restart: unless-stopped
    networks:
      - smarthome-network

  sensor-monitoring:
    build:
      context: ./sensor_monitoring
      dockerfile: Dockerfile
    container_name: sensor-monitoring
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/smarthome
      - PORT=9004
    ports:
      - "9004:9004"
    restart: unless-stopped
    networks:
      - smarthome-network

  temperature-api:
    build:
      context: ./temperature-api
      dockerfile: Dockerfile
    container_name: temperature-api
    environment:
      - PORT=8081
    ports:
      - "8081:8081"
    restart: unless-stopped
    networks:
      - smarthome-network

  app:
    build:
      context: ./smart_home
      dockerfile: Dockerfile
    container_name: smarthome-app
    depends_on:
      postgres:
        condition: service_healthy
      temperature-api:
        condition: service_started
      module-managment:
        condition: service_started
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/smarthome
      - TEMPERATURE_API_URL=http://temperature-api:8081
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - smarthome-network

volumes:
  postgres_data:

networks:
  smarthome-network:
    driver: bridge